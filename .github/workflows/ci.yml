name: Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gameflix_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/gameflix_ci
          SPRING_DATASOURCE_USERNAME: ci_user
          SPRING_DATASOURCE_PASSWORD: ci_password
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          JWT_SECRET: 001d794348364ed3cb2856e20c82a6fc2d3496f7a0cda7aaafecb6998f0f2ffc

      - name: Build Docker image
        run: docker build -t gameflix/api:$GITHUB_SHA .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: gameflix/api:$GITHUB_SHA
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan and gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gameflix/api:$GITHUB_SHA
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Archive SBOM as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json